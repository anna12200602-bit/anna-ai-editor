<title>AI 剪輯陪跑助手</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: one narrow column, a sticky progress bar on top, one task card at a time, primary action pinned at the bottom */
:root{
  --bg:#FFFBF0; --surface:#FFFFFF; --soft:#EEF2F6; --line:#ECE5E2; --chip:#F6E6EC;
  --fg:#4E4E4C; --muted:#8C8C89; --accent:#6C6C6A; --accent-fg:#FFFFFF; --accent-soft:#EEF2F6;
  --good:#6C6C6A; --good-soft:#F3EEF1; --warn:#9A6A7C; --warn-soft:#F8ECF1; --bad:#B0505E; --bad-soft:#F8E6EA;
  --line-green:#06C755; --taupe:#A97C8D;
  --sans:'Noto Sans TC',-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#232324; --surface:#2C2C2E; --soft:#33363C; --line:#424245; --chip:#5A4A51;
  --fg:#F2EFEA; --muted:#B4B2AE; --accent:#E8CCD7; --accent-fg:#3A3A39; --accent-soft:#33363C;
  --good:#DEE5ED; --good-soft:#33363C; --warn:#E8CCD7; --warn-soft:#3D3036; --bad:#E89AA6; --bad-soft:#40282E;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#232324; --surface:#2C2C2E; --soft:#33363C; --line:#424245; --chip:#5A4A51;
  --fg:#F2EFEA; --muted:#B4B2AE; --accent:#E8CCD7; --accent-fg:#3A3A39; --accent-soft:#33363C;
  --good:#DEE5ED; --good-soft:#33363C; --warn:#E8CCD7; --warn-soft:#3D3036; --bad:#E89AA6; --bad-soft:#40282E;
  color-scheme:dark;}

.frost{position:relative;border-radius:18px;overflow:hidden;margin-top:14px;background:var(--soft);min-height:236px}
.frost-bg{padding:12px 16px;filter:blur(4px);pointer-events:none;user-select:none}
.frost-bg .fr-row{display:flex;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.frost-fg{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:16px;background:rgba(255,251,240,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.frost-fg input[type=text]{background:rgba(255,255,255,.7);text-align:center}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .frost-fg{background:rgba(35,35,36,.55)}:root:not([data-theme="light"]) .frost-fg input[type=text]{background:rgba(44,44,46,.7)}}
:root[data-theme="dark"] .frost-fg{background:rgba(35,35,36,.55)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
h1,h2,h3{text-wrap:balance;margin:0}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:8px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:900;font-size:14px;letter-spacing:.04em;color:var(--fg);background:none;border:0;padding:0;cursor:pointer}
.top-link{font-size:12.5px;color:var(--muted);background:none;border:0;cursor:pointer;text-decoration:underline;padding:4px 0}
.prog{display:flex;flex-direction:column;gap:6px}
.prog-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.prog-meta b{color:var(--fg)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 20px;margin-top:16px;box-shadow:0 1px 3px rgba(78,78,76,.05)}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.14em;color:var(--muted);margin-bottom:8px}
.card h2{font-size:21px;font-weight:600;line-height:1.45;letter-spacing:.01em;margin-bottom:8px}
.lead{color:var(--muted);font-size:14px;margin:0 0 14px}
.sec{margin-top:22px}
.sec-t{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.1em;margin-bottom:8px}
.sec p{margin:0}
ol.how{margin:0;padding:0;list-style:none;counter-reset:h;display:flex;flex-direction:column;gap:8px}
ol.how li{counter-increment:h;display:flex;gap:10px;font-size:14.5px}
ol.how li::before{content:counter(h);flex:0 0 22px;height:22px;border-radius:50%;border:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:2px}
.done-std{border-left:2px solid var(--good);padding:2px 0 2px 12px;font-size:14px}
.done-std b{color:var(--good)}
.alt{border-left:2px solid var(--line);padding:2px 0 2px 12px;font-size:14px;color:var(--fg)}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:999px;padding:14px 18px;font-size:15px;font-weight:600;letter-spacing:.02em;cursor:pointer;background:var(--accent);color:var(--accent-fg);text-decoration:none}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.soft{background:var(--soft);color:var(--fg)}
.btn.line{background:var(--line-green);color:#FFFFFF}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:10px;margin-top:14px}
.btn-row .btn{flex:1}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(to top,var(--bg) 70%,transparent);padding-top:18px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px}
.dock-in .btn{flex:1}
.dock-in .btn.small{flex:0 0 auto;width:auto;padding-inline:18px}

.hero::after{content:'';position:absolute;inset:0;background:rgba(30,25,22,.4);border-radius:inherit;display:block}
.hero h1,.hero p{position:relative;z-index:1}
.hero h1{color:#FFFFFF;font-weight:600}
.hero p{color:#EDE6DC!important}
.hero .tag{display:inline-block;position:relative;z-index:1;font-size:11.5px;font-weight:700;letter-spacing:.12em;color:#4E4E4C;background:#F3EEE6;border-radius:999px;padding:3px 12px;margin-bottom:12px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero{}:root:not([data-theme="light"]) .hero h1{color:#F3EEDC}:root:not([data-theme="light"]) .hero p{color:#C9C0B2!important}}
:root[data-theme="dark"] .hero{}:root[data-theme="dark"] .hero h1{color:#F3EEDC}:root[data-theme="dark"] .hero p{color:#C9C0B2!important}
.hero h1{font-size:28px;line-height:1.4;font-weight:700;letter-spacing:.02em}
.hero h1.one{font-size:min(4.4vw,21px);white-space:nowrap;letter-spacing:0;margin:2px 0 0}
.hero p{color:var(--muted);margin:10px 0 0;font-size:14.5px}
.pipe{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.pipe span{font-size:12px;color:var(--muted)}
.pipe span:not(:last-child)::after{content:'→';margin-left:6px;opacity:.5}
.home-actions{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.home-btn{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;cursor:pointer}
.home-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.home-btn .ic{flex:0 0 36px;height:36px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px}
.home-btn.primary .ic{border-color:rgba(255,255,255,.35)}
.home-btn b{display:block;font-size:16px;font-weight:600}
.home-btn small{display:block;font-size:12.5px;opacity:.75}
.home-btn:disabled{opacity:.45;cursor:not-allowed}

/* choices */
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;font-size:14.5px}
.choice .k{flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;margin-top:1px}
.choice b{display:block;font-size:15.5px;font-weight:600}
.choice small{color:var(--muted);font-size:13px}
.choice.on{border-color:var(--accent);background:var(--accent-soft)}
.choice.on .k{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.cmp{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:12px}
.cmp th,.cmp td{padding:9px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.cmp th{font-size:12px;color:var(--muted);font-weight:700}
.cmp td:first-child{color:var(--muted);white-space:nowrap}

/* fields */
.q-num{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.q{font-size:20px;font-weight:600;line-height:1.5;margin-bottom:14px}
textarea,input[type=text]{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:14px;padding:12px 14px;font-family:inherit;font-size:15px;line-height:1.6}
textarea{min-height:150px;resize:vertical}
textarea::placeholder,input::placeholder{color:var(--muted);opacity:.75}
textarea:focus,input:focus{outline:none;border-color:var(--accent)}
.field-gap{margin-top:12px}
.err{color:var(--bad);font-size:13px;margin-top:6px;min-height:18px}

/* hub */
.stages{display:flex;flex-direction:column;margin-top:6px}
.stage{display:flex;align-items:center;gap:12px;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 2px;text-align:left;width:100%;cursor:pointer}
.stage .n{flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.stage .t{flex:1;min-width:0}
.stage .t b{display:block;font-size:15px;font-weight:600}
.stage .t small{color:var(--muted);font-size:12.5px}
.stage.done .n{background:var(--good);border-color:var(--good);color:#FFFFFF}
.stage.now{background:var(--accent-soft);border-radius:12px;border-bottom-color:transparent;padding-inline:10px}
.stage.now .n{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.stage:disabled{opacity:.5;cursor:not-allowed}
.pill{flex:0 0 auto;font-size:11.5px;font-weight:500;border-radius:999px;padding:2px 8px;color:var(--muted)}
.pill.done{background:var(--good-soft);color:var(--good)}
.pill.now{background:var(--accent);color:var(--accent-fg)}
.devbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 4px;margin-top:6px;font-size:13.5px;color:var(--muted)}

/* AI output */
.ai-box{background:var(--soft);border-radius:16px;padding:14px;font-size:14px;min-height:60px}
.ai-status{font-size:13px;color:var(--muted)}
.an-group{margin-top:12px}
.an-group h4{margin:0 0 6px;font-size:13.5px;display:flex;gap:8px;align-items:center}
.an-group h4 span{font-size:11px;background:var(--surface);border-radius:999px;padding:1px 8px;color:var(--muted);font-weight:700}

function noPeriod(root){

  list.forEach(n => {

    n.parentNode.replaceChild(frag, n);
  });
}
